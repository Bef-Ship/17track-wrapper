# 构建并推送 tracking 镜像到腾讯云 CCR
# 镜像: ccr.ccs.tencentyun.com/solat/tracking:<tag>
# 镜像内单一二进制 /app/tracking：TRACKING_ROLE=api|worker|all；
# /app/tracking-worker 是指向它的软链，默认 worker 角色（cron/asynq）
#
# push main          → tag=d-sha-<7位短 SHA>（测试/develop）
# release published  → tag=<GitHub Release tag>（正式）
# workflow_dispatch  → 手动重打已有 git tag
#
# 仓库 Secrets:
#   CCR_USERNAME  — 腾讯云账号 UIN / CCR 用户名
#   CCR_PASSWORD  — CCR 登录密码（或临时密码）
# 可选 Variables:
#   CCR_REGISTRY  — 默认 ccr.ccs.tencentyun.com
#   CCR_NAMESPACE — 默认 solat
#   CCR_IMAGE     — 默认 tracking

name: Release

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 已有 git tag（如 v1.2.3），用于手动重打镜像
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-tracking-${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}
  cancel-in-progress: true

env:
  CCR_REGISTRY: ${{ vars.CCR_REGISTRY || 'ccr.ccs.tencentyun.com' }}
  CCR_NAMESPACE: ${{ vars.CCR_NAMESPACE || 'solat' }}
  CCR_IMAGE: ${{ vars.CCR_IMAGE || 'tracking' }}

jobs:
  build-push:
    name: Build & push CCR
    runs-on: ubuntu-24.04
    steps:
      - name: Resolve version tag
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW="${{ inputs.tag }}"
            GIT_REF="refs/tags/${RAW#refs/tags/}"
          elif [ "${{ github.event_name }}" = "release" ]; then
            RAW="${{ github.event.release.tag_name }}"
            GIT_REF="refs/tags/${RAW#refs/tags/}"
          else
            SHORT="$(echo '${{ github.sha }}' | cut -c1-7)"
            RAW="d-sha-${SHORT}"
            GIT_REF="${{ github.sha }}"
          fi
          RAW="${RAW#refs/tags/}"
          if [ -z "$RAW" ]; then
            echo "empty release/tag" >&2
            exit 1
          fi
          if [[ ! "$RAW" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "invalid image tag: $RAW" >&2
            exit 1
          fi
          echo "image_tag=$RAW" >> "$GITHUB_OUTPUT"
          echo "git_ref=$GIT_REF" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "release" ] && [ "${{ github.event.release.prerelease }}" != "true" ]; then
            echo "tag_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag_latest=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Resolved image_tag=$RAW git_ref=$GIT_REF"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.ver.outputs.git_ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Tencent CCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.CCR_REGISTRY }}
          username: ${{ secrets.CCR_USERNAME }}
          password: ${{ secrets.CCR_PASSWORD }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.CCR_REGISTRY }}/${{ env.CCR_NAMESPACE }}/${{ env.CCR_IMAGE }}
          tags: |
            type=raw,value=${{ steps.ver.outputs.image_tag }}
            type=raw,value=latest,enable=${{ steps.ver.outputs.tag_latest }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
